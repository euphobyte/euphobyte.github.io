<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>MaSi - Tracker</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 600px;
			width: 800px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
	
<style>
h2{
  font-family: Arimo;
  text-align: center;
}
div{
  margin: auto;
}
</style>
</head>
<body>


<h2>MaSi Tracker</h2>
<div id="map" style="width: 800px; height: 600px;"></div>
<script>

	const map = L.map('map').setView([51.8333, 5.8624], 12);

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	const marker = L.marker([51.837, 5.865]).addTo(map);

	const circle = L.circle([51.508, -0.11], {
		color: 'red',
		fillColor: '#f03',
		fillOpacity: 0.5,
		radius: 500
	}).addTo(map);

	const polygon = L.polygon([
		[51.509, -0.08],
		[51.503, -0.06],
		[51.51, -0.047]
	]).addTo(map);


      if (navigator.geolocation) {
            // watchPosition updates automatically if the user moves
            navigator.geolocation.watchPosition(success, error, {
                enableHighAccuracy: true, // Forces the device to use hardware GPS if available
                timeout: 5000,
                maximumAge: 0
            });
        } else {
            alert("Your browser does not support Geolocation features.");
        }

  function success(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    alert(lat + " / " + lng );
}
</script>



</body>
</html>
