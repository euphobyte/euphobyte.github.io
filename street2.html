<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStreetMap Netherlands</title>
    <!-- Leaflet CSS from cdnjs -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-h9AnvUJqC919fcf5f6vB6B5m1WvOUpDcA79a32c6b160B5B16F6aB4F69B1D6F18B1f3b0e3D6D0F9A68D6A1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript from cdnjs -->
    <script src="https://cloudflare.com" integrity="sha512-puBzdNZa5ww0V062eM6WdB6bA03J7z88L9EFA3mC5b4E6G4Z7z6Z5w8E0F16C0D58C28A6D3B16D17870E8A8w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // 1. Initialize map centered on the Netherlands [Latitude, Longitude]
        const netherlandsCoords = [52.1326, 5.2913];
        const zoomLevel = 8; // Fits the entire country on most screens
        
        const map = L.map('map').setView(netherlandsCoords, zoomLevel);

        // 2. Add the OpenStreetMap tile layer
        const osmTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        });
        
        osmTiles.addTo(map);

        // 3. Optional: Add a marker on the capital city (Amsterdam)
        L.marker([52.3676, 4.9041])
            .addTo(map)
            .bindPopup('<b>Amsterdam</b><br>Capital of the Netherlands.')
            .openPopup();
    </script>
</body>
</html>
