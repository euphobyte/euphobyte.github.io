<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Location on OpenStreetMap</title>

    <!-- 1. Include Leaflet CSS and JavaScript from CDN -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* 2. Set explicit dimensions for the map container */
        #map {
            height: 100vh;
            width: 100%;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- 3. The container where OpenStreetMap will render -->
    <div id="map"></div>

    <script>
        // 4. Initialize the map with default coordinates (0, 0) and low zoom
        const map = L.map('map').setView([0, 0], 2);

        // 5. Add the OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Variables to track the marker and accuracy circle
        let marker, circle;

        // 6. Define success and error callbacks for the Geolocation API
        function success(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Remove existing layers if the location updates
            if (marker) map.removeLayer(marker);
            if (circle) map.removeLayer(circle);

            // Add a pinpoint marker and an accuracy radius circle to the map
            marker = L.marker([lat, lng]).addTo(map);
            circle = L.circle([lat, lng], { radius: accuracy }).addTo(map);

            // Dynamically center and zoom the map onto the GPS coordinates
            map.setView([lat, lng], 16);
            
            marker.bindPopup(`<b>You are here!</b><br>Accuracy: ${Math.round(accuracy)} meters`).openPopup();
        }

        function error(err) {
            if (err.code === 1) {
                alert("Please allow location access to use this feature.");
            } else {
                alert("Unable to retrieve your current location.");
            }
        }

        // 7. Request the live GPS position from the browser
        if (navigator.geolocation) {
            // watchPosition updates automatically if the user moves
            navigator.geolocation.watchPosition(success, error, {
                enableHighAccuracy: true, // Forces the device to use hardware GPS if available
                timeout: 5000,
                maximumAge: 0
            });
        } else {
            alert("Your browser does not support Geolocation features.");
        }
    </script>
</body>
</html>
