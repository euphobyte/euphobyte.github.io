<html>
<head>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div id="iframe-video" class="video-iframe"></div>
<script>
player = new YT.Player('iframe-video', {
  videoId: 'RK1K2bCg4J8',
    playerVars: {
      rel: '0'
    },
    events: {
      'onReady': playerInitialize
    }
});

function playerInitialize (event) {
  event.target.playVideo(); 
}
</script>
</body>
</html>
