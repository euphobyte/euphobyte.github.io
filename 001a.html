
<html>
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
iframe {
width: 50%;
aspect-ratio: 16 / 9;
}
</style>
<script>
function test(){  
  var if1 = document.getElementById('youtube-player');
  if1.src = "https://www.youtube.com/embed/H7Q3pVAOSLE?enablejsapi=1";
}
function onPlayerReady(event){
  event.target.playVideo();
}
</script>  
</head>
<body>
<iframe
id="youtube-player"
src="https://www.youtube.com/embed/GumP37XZ8SY?enablejsapi=1"
onready="onPlayerReady(event)">
</iframe>
<hr>
<button onclick="test()">Play</button>
</body>
</html>
