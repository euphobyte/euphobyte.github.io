<html>
<head>
<title>Euphobyte</title>
<script>
const lines = ["ncurses.txt", "pc_bios.txt", "pc_boot_sector.txt","pc_boot_second.txt","pc_boot_keyb.txt","pc_boot_serial.txt",
               "cs_console.txt", "cs_serial.txt","control_chars.txt", "xmodem.txt"];  
window.addEventListener("load", (event) => {
  initList();
});

function initList(){
  const el=document.querySelector("#list1");
  lines.forEach((str) => {
    const ln= document.createElement("li");
    ln.innerText = str;
    ln.addEventListener("click", clickedItem);
    el.appendChild(ln);                
  });  
}

function clickedItem(e){
  const el = document.querySelector("#frame_a");
  el.src = e.target.innerText;
}
</script>  
<style>
a{
  text-decoration: none;
}
li{
  font: normal 10pt Consolas;
  cursor: pointer;
}
#outer{
  display: flex;
  height: 100%;
}
#left, #right{
  flex: 1;
}
#left{
  display: flex;
  flex-direction: column;
  background-color: oldlace;
  margin-right: 4px;
  margin-left: 4px;
}
#msg{
  font: italic 8pt Consolas;
}
#right{
  display: flex;
  border-left: 1px solid lightgrey;
  padding-left: 8px;
  overflow: hidden;
}
iframe{
  flex: 1;
  border: none;
}
h3{
  font: bold 11pt Consolas;
}
hr{
  border: none;
  border-top: 1px solid lightgrey;
}
</style>  
</head>
<body>  
<div id="outer">
<div id="left">
<h3>Exploring Digital Technology</h3>
<ul id="list1"></ul>
<hr><br>
<i><a href="nojs.html">Go for the future, sans JS version of this page</a></i><br><br>
<span id="msg">FOR EDUCATIONAL PURPOSES ONLY. Source code is provided as-is without warranty, and disclaiming liability for damages resulting from using the source code.</span>  
</div>
<div id="right">
<iframe id="frame_a"></iframe>  
</div>  
</div>  
</body>  
</html>
