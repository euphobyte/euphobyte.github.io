<html>
<head>
<title>Euphobyte</title>
<script>
const lines = ["ncurses.txt", "pc_bios.txt"];  
window.addEventListener("load", (event) => {
  initList();
});

function initList(){
  const el=document.querySelector("#list1");
  lines.forEach((str) => {
    const ln= document.createElement("li");
    ln.innerText = str;
    ln.addEventListener("click", clickedItem);
    el.appendChild(ln);                
  });  
}

function clickedItem(e){
  const el = document/querySelector("#frame_a");
  el.src = e.target.innerText;
}
</script>  
<style>
li{
  cursor: pointer;
}
#outer{
  display: flex;
  height: 100%;
}
#left, #right{
  flex: 1;
}
#right{
  display: flex;
  border-left: 1px solid lightgrey;
  padding-left: 8px;
  overflow: hidden;
}
iframe{
  flex: 1;
  border: none;
}
</style>  
</head>
<body>  
<div id="outer">
<div id="left">
<ul id="list1"></ul>  
<pre>
Exploring Digital Technology
  
- <a href="ncurses.txt" target="frame_a">ncurses.txt</a>
- <a href="pc_bios.txt" target="frame_a">pc_bios.txt</a>  
</pre>
</div>
<div id="right">
<iframe id="frame_a"></iframe>  
</div>  
</div>  
</body>  
</html>
