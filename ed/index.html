<html>
<head>
<title>Ed</title>
<style>
button{
    width: 100%;
}
#st{
    padding: 8px;
}
html{
    text-rendering: optimizeLegibility !important;
    -webkit-font-smoothing: antialiased !important;
}
ul,li{
    padding: 0;
    margin: 0;
}
ul li { list-style: none; font: normal 9pt Segoe UI;}
#outer{
  height: 100%;
  display: flex;
}
#st{
  width: 100px;
  background-color: #eee;
}
#tx{
  flex: 1;
}
#txt1{
  width: 100%;
  height: 100%; 
  outline: none;
  resize: none;
  border: 1px solid #eee;
  padding: 8px;
  font-family: Consolas;
  color: #333;
}
</style>  
<script>
function init(){
  var el = document.getElementById("txt1");
  el.focus();
}
</script>
</head>
<body onload="init()">
<div id="outer">
<div id="st">
<ul>
<li><button>Save</button>
<li><button>Open</button>    
<li><input type="checkbox"></input><label>Spelling</label>
<li><input type="checkbox"></input><label>Wrap</label>    
<li><input type="checkbox"></input><label>Numbers</label>
<li><label>Tab:</label><input type="text" size="2"></input>    
</ul>    
</div>
<div id="tx"><textarea id="txt1" spellcheck="true" wrap="soft"></textarea></div>
</div>
</body>
</html>
