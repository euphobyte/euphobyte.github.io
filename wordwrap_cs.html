<div><pre id="txt1">
</pre></div>
<script>
const response1  = tst();

function tst(){
  let xmlhttp = new XMLHttpRequest();
  xmlhttp.onreadystatechange = function() {
    if (xmlhttp.readyState == XMLHttpRequest.DONE) {
      if (xmlhttp.status == 200) {
        document.getElementById("txt1").textContent = xmlhttp.responseText;
      }else{ 
        alert('Http error');
      }
    }else{
      alert('Error http call');
    }
  };
  xmlhttp.open("GET", "https://euphobyte.github.io/doc/pc_bios.txt", true);
  xmlhttp.send();
}

</script>

#txt1{
  white-space: pre-wrap;  
  font: normal 12.5px Consolas;
}
