<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>YouTube Veilige Test</title>
</head>
<body>

    <!-- Deplek waar de video komt -->
    <div id="player"></div>

    <script>
        // Direct toevoegen aan de head (voorkomt fouten met insertBefore)
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        document.head.appendChild(tag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'M7lc1UVf-VE',
                playerVars: {
                    'playsinline': 1
                }
            });
        }
    </script>

</body>
</html>
